services:
  cinetheme:
    build:
      context: .
      dockerfile: Dockerfile
    image: cinetheme:latest
    container_name: cinetheme
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
