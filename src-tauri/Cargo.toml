[package]
name = "cinetheme"
version = "0.1.0"
description = "Production-grade, web-first Jellyfin client"
authors = ["CineTheme Team"]
edition = "2021"

[lib]
name = "cinetheme_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
