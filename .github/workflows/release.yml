name: Release Packaging & Distribution

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Desktop
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install npm dependencies
        run: npm ci

      - name: Run verification checks
        run: |
          npm run typecheck
          npm run lint
          npm test -- --run

      - name: Build Web Production Assets
        run: npm run build

      - name: Build Tauri Windows Installers
        run: npx @tauri-apps/cli build

      - name: Upload Windows Installers
        uses: actions/upload-artifact@v4
        with:
          name: cinetheme-windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/*.exe

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install npm dependencies
        run: npm ci

      - name: Build Web Assets & Sync Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: Decode Release Keystore (if secret configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/release.keystore"
          fi

      - name: Assemble Android Release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'cinetheme' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./android/gradlew
          ./android/gradlew -p android assembleRelease

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinetheme-android-apk
          path: |
            android/app/build/outputs/apk/release/*.apk

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: cinetheme-windows-installers
          path: dist-release/windows

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: cinetheme-android-apk
          path: dist-release/android

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/windows/**/*.exe
            dist-release/windows/**/*.msi
            dist-release/windows/*.exe
            dist-release/windows/*.msi
            dist-release/android/**/*.apk
            dist-release/android/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
