name: Release Packaging & Distribution

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Desktop
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install npm dependencies
        run: npm ci

      - name: Run verification checks
        run: |
          npm run typecheck
          npm run lint
          npm test -- --run

      - name: Synchronize Release Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/v(.+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "RELEASE_VERSION=$VERSION" >> $GITHUB_ENV
          node -e "
            const fs = require('fs');
            const v = process.env.RELEASE_VERSION;
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = v;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            const tauri = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            tauri.version = v;
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(tauri, null, 2) + '\n');
          "

      - name: Build Web Production Assets
        run: npm run build

      - name: Build Tauri Windows Installers
        run: npx @tauri-apps/cli build

      - name: Stage Windows Release Artifacts
        shell: bash
        run: |
          mkdir -p dist-release/windows

          NSIS_SRC=$(find src-tauri/target/release/bundle/nsis -name "*-setup.exe" | head -n 1)
          if [ -f "$NSIS_SRC" ]; then
            cp "$NSIS_SRC" "dist-release/windows/CineTheme-${RELEASE_VERSION}-Windows-x64-Setup.exe"
          else
            echo "::error::NSIS installer not found"
            exit 1
          fi

          MSI_SRC=$(find src-tauri/target/release/bundle/msi -name "*.msi" | head -n 1)
          if [ -f "$MSI_SRC" ]; then
            cp "$MSI_SRC" "dist-release/windows/CineTheme-${RELEASE_VERSION}-Windows-x64.msi"
          else
            echo "::error::MSI installer not found"
            exit 1
          fi

          EXE_SRC="src-tauri/target/release/cinetheme.exe"
          if [ -f "$EXE_SRC" ]; then
            cp "$EXE_SRC" "dist-release/windows/CineTheme-${RELEASE_VERSION}-Windows-x64.exe"
          else
            echo "::error::Standalone cinetheme.exe not found"
            exit 1
          fi

          ls -lh dist-release/windows/

      - name: Upload Windows Installers
        uses: actions/upload-artifact@v4
        with:
          name: cinetheme-windows-installers
          path: dist-release/windows/*

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install npm dependencies
        run: npm ci

      - name: Synchronize Release Version
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/v(.+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "RELEASE_VERSION=$VERSION" >> $GITHUB_ENV
          node -e "
            const fs = require('fs');
            const v = process.env.RELEASE_VERSION;
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = v;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Build Web Assets & Sync Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* || "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing! Production release tags and manual validation require a signed APK."
              exit 1
            else
              echo "Warning: ANDROID_KEYSTORE_BASE64 not configured for non-tag build. Continuing in unsigned mode."
            fi
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/release.keystore"
          fi

      - name: Assemble Android Release APK
        env:
          APP_VERSION: ${{ env.RELEASE_VERSION }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'cinetheme' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./android/gradlew
          ./android/gradlew -p android assembleRelease -PversionName="$RELEASE_VERSION"

      - name: Verify and Stage Android Release Artifact
        run: |
          mkdir -p dist-release/android

          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            APK_SRC="android/app/build/outputs/apk/release/app-release.apk"
          elif [ -f "android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            APK_SRC="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          else
            echo "::error::No release APK found in android/app/build/outputs/apk/release/"
            exit 1
          fi

          if [[ "$GITHUB_REF" == refs/tags/v* || "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$APK_SRC" == *"unsigned"* ]]; then
              echo "::error::Signed release APK required! assembleRelease produced app-release-unsigned.apk."
              exit 1
            fi

            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
            if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
              echo "::error::apksigner binary could not be found in $ANDROID_HOME/build-tools"
              exit 1
            fi

            echo "Verifying release APK with apksigner ($APKSIGNER)..."
            "$APKSIGNER" verify --verbose "$APK_SRC" || {
              echo "::error::apksigner verification failed on $APK_SRC"
              exit 1
            }
          fi

          TARGET_APK="dist-release/android/CineTheme-${RELEASE_VERSION}-Android.apk"
          cp "$APK_SRC" "$TARGET_APK"
          echo "Successfully staged $TARGET_APK"
          ls -lh dist-release/android/

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinetheme-android-apk
          path: dist-release/android/*.apk

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: cinetheme-windows-installers
          path: dist-release/windows

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: cinetheme-android-apk
          path: dist-release/android

      - name: List Release Assets
        run: |
          ls -lh dist-release/windows/
          ls -lh dist-release/android/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/windows/CineTheme-*-Windows-x64-Setup.exe
            dist-release/windows/CineTheme-*-Windows-x64.msi
            dist-release/windows/CineTheme-*-Windows-x64.exe
            dist-release/android/CineTheme-*-Android.apk
          draft: false
          prerelease: false
          generate_release_notes: true
